name: TrainBoard
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
options:
  bundleIdPrefix: com.josephmoylan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 69TCYK37VK
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TrainBoard:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboard]
        com.apple.security.temporary-exception.mach-lookup.global-name: ["$(PRODUCT_BUNDLE_IDENTIFIER)-spks"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Train Board
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "4"
        SUFeedURL: https://raw.githubusercontent.com/Joseph2475/train-board/main/appcast.xml
        SUPublicEDKey: HcbTYts2LdrZu7HlQdbWtWpHgYTomChnLnMBgHzbS0Q=
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboard
    dependencies:
      - target: TrainBoardWidget
        embed: true
      - package: Sparkle
  TrainBoardWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboard]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Train Board
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "4"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboard.widget
