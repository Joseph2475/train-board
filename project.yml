name: TrainBoard
options:
  bundleIdPrefix: com.josephmoylan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 69TCYK37VK
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TrainBoard:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboard]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Train Board
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "3"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboard
    dependencies:
      - target: TrainBoardWidget
        embed: true
  TrainBoardWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboard]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Train Board
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "3"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboard.widget
